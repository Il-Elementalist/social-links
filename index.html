<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png"> <!-- Favicon -->

  <link rel="stylesheet" href="./styles/style.css">    <!-- Link to CSS file -->

  <link rel="preconnect" href="https://fonts.googleapis.com">     <!-- Link to Google Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>


</head>
<body>
  <section class="card">
    <div class="img-profile">
      <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class="profile-img">
    </div>
    <div class="profile-info">
      <h1>Jessica Randall</h1>
      <p class="location">London, United Kingdom</p>
      
    </div>

    <p class="bio">"Front-end developer and avid reader."</p>

    <div>
      <nav> <!-- Social Links -->
        <button>GitHub</button>
        <button>Frontend Mentor</button>
        <button>LinkedIn</button>
        <button>Twitter</button>
        <button>Instagram</button>
      </nav>
    </div>
  </section>
  
  <footer>
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Steven J. Martin</a>.
  </footer>
</body>
</html>
